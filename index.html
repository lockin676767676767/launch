<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lockin's Game Site</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --bg-alt: #ebf0f7;
      --surface: #ffffff;
      --surface-2: #edf2fb;
      --text: #111827;
      --muted: #4b5563;
      --accent: #3b82f6;
      --accent-2: #10b981;
      --border: rgba(17, 24, 39, 0.12);
      --button-text: #ffffff;
      --shadow: 0 20px 48px rgba(15, 23, 42, 0.12);
      --chip-bg: rgba(59, 130, 246, 0.1);
      --chip-text: #1f2937;
    }

    body[data-theme="dark"] {
      --bg: #0b1020;
      --bg-alt: #141d31;
      --surface: rgba(17,24,39,0.9);
      --surface-2: rgba(19,30,52,0.85);
      --text: #e5eefb;
      --muted: #a5b4d3;
      --accent: #7c9cff;
      --accent-2: #36d399;
      --border: rgba(148,163,184,0.18);
      --button-text: #08111d;
      --shadow: 0 24px 64px rgba(2, 6, 23, 0.52);
      --chip-bg: rgba(124,156,255,0.16);
      --chip-text: #e5eefb;
    }

    body[data-theme="cyber"] {
      --bg: #070b17;
      --bg-alt: #0d1226;
      --surface: #101935;
      --surface-2: #0d1631;
      --text: #7ef7c7;
      --muted: #9eeed1;
      --accent: #00ff88;
      --accent-2: #00d0ff;
      --border: rgba(0,255,136,0.3);
      --button-text: #03110d;
      --shadow: 0 0 28px rgba(0,255,136,0.28);
      --chip-bg: rgba(0,255,136,0.12);
      --chip-text: #7ef7c7;
    }

    body[data-theme="retro"] {
      --bg: #ff00ff;
      --bg-alt: #ff7b00;
      --surface: #ffff00;
      --surface-2: #ffdb00;
      --text: #080808;
      --muted: #1f1f1f;
      --accent: #00ffff;
      --accent-2: #ff4d4d;
      --border: rgba(0,0,0,0.6);
      --button-text: #000000;
      --shadow: 6px 6px 0 rgba(0,0,0,0.4);
      --chip-bg: rgba(0,255,255,0.2);
      --chip-text: #000000;
    }

    body[data-theme="sunset"] {
      --bg: #ff7a59;
      --bg-alt: #ffb067;
      --surface: #ffd166;
      --surface-2: #ffe8a3;
      --text: #2d1b12;
      --muted: #563b30;
      --accent: #f72585;
      --accent-2: #ffb703;
      --border: rgba(93,47,26,0.28);
      --button-text: #fff7f2;
      --shadow: 0 20px 48px rgba(111, 49, 22, 0.18);
      --chip-bg: rgba(247,37,133,0.1);
      --chip-text: #2d1b12;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-alt), var(--bg));
      color: var(--text);
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      overflow-y: auto;
      grid-row: 1;
      grid-column: 1;
    }

    .sidebar-section {
      padding: 0 16px 20px;
    }

    .sidebar-title {
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 16px 0 12px;
      padding: 0 12px;
    }

    .sidebar-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .sidebar-btn:hover,
    .sidebar-btn.active {
      background: var(--accent);
      color: var(--button-text);
      border-color: transparent;
    }

    .main-content {
      grid-row: 1;
      grid-column: 2;
      padding: 24px;
      overflow-y: auto;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.02em;
      font-size: 1.35rem;
      padding: 0 16px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin: 0 0 24px;
      max-width: 100%;
    }

    .wotg-compact {
      background: linear-gradient(135deg, rgba(124,156,255,0.1), rgba(52,211,153,0.08));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .wotg-compact:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .wotg-compact-img {
      width: 100px;
      height: 70px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .wotg-compact-text h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
    }

    .wotg-compact-text p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px 10px 36px;
      color: var(--text);
      outline: none;
      font-size: 0.9rem;
      transition: border-color 0.2s ease;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.7;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(124,156,255,0.5);
    }

    .thumb-wrap {
      position: relative;
      overflow: hidden;
      background: var(--surface-2);
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 1.35 / 1;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .thumb.loaded { opacity: 1; }

    .thumb-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-weight: 800;
      font-size: 0.65rem;
    }

    .game-body {
      padding: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      background: var(--chip-bg);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.65rem;
      font-weight: 800;
      border: 1px solid var(--border);
    }

    .game-title {
      margin: 8px 0 4px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .game-description {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.3;
      font-size: 0.75rem;
      min-height: 30px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .play-btn, .tips-btn {
      flex: 1;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .play-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
      border: none;
    }

    .tips-btn {
      background: transparent;
      color: var(--text);
    }

    .play-btn:hover, .tips-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 200;
      background: rgba(0,0,0,0.6);
      padding: 20px;
    }

    .modal.open { display: grid; }

    .modal-content {
      width: min(680px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
      max-height: 80vh;
      overflow: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .tips-list {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .tips-list li {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
    }

    .empty-state.visible { display: block; }

    .suggestion-form .form-group {
      margin-bottom: 12px;
    }

    .suggestion-form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .suggestion-form input,
    .suggestion-form textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      resize: vertical;
      font-size: 0.9rem;
    }

    .admin-panel {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .admin-panel h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .admin-code-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .changelog-entry {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .changelog-entry:last-child {
      border-bottom: none;
    }

    .changelog-date {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .changelog-text {
      margin: 4px 0 0;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    @media (max-width: 1024px) {
      body { grid-template-columns: 1fr; }
      .sidebar { grid-column: 1; grid-row: 1; max-height: 140px; overflow-x: auto; display: flex; flex-direction: row; padding: 12px; border-right: none; border-bottom: 1px solid var(--border); width: 100%; }
      .sidebar-section { display: flex; gap: 12px; padding: 0; margin: 0; white-space: nowrap; }
      .sidebar-title { display: none; }
      .sidebar-btn { margin-bottom: 0; flex-shrink: 0; }
      .main-content { grid-column: 1; grid-row: 2; }
      body { grid-template-rows: 140px 1fr; }
    }
  </style>
</head>
<body data-theme="dark">
  <aside class="sidebar">
    <div class="brand">🎮 Lockin</div>

    <div class="sidebar-section">
      <p class="sidebar-title">Theme</p>
      <button class="sidebar-btn" data-theme="light">☀️ Light</button>
      <button class="sidebar-btn active" data-theme="dark">🌙 Dark</button>
      <button class="sidebar-btn" data-theme="cyber">⚡ Cyber</button>
      <button class="sidebar-btn" data-theme="retro">🕹️ Retro</button>
      <button class="sidebar-btn" data-theme="sunset">🌅 Sunset</button>
    </div>

    <div class="sidebar-section">
      <p class="sidebar-title">Genre</p>
      <div id="genreContainer"></div>
    </div>

    <div class="sidebar-section">
      <p class="sidebar-title">Tools</p>
      <button class="sidebar-btn" onclick="openChangelog()">📋 Changelog</button>
      <button class="sidebar-btn" onclick="openSuggestionModal()">➕ Suggest Game</button>
      <button class="sidebar-btn" onclick="openAdminPanel()">🔐 Admin</button>
    </div>
  </aside>

  <main class="main-content">
    <h1>Play Amazing Games</h1>
    <p class="subtitle">Your personal collection of browser games, themes, and favorites.</p>

    <div id="wotgCompact" class="wotg-compact" onclick="playGameOfWeek()" style="display:none;">
      <img id="wotgImg" class="wotg-compact-img" alt="Game of the week" />
      <div class="wotg-compact-text">
        <h3 id="wotgTitle">Game of the Week</h3>
        <p id="wotgDesc">Click to play</p>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="searchInput" type="search" placeholder="Search games..." />
    </div>

    <div id="adminPanelContainer" style="display:none;"></div>

    <div id="gamesGrid" class="games-grid"></div>
    <div id="emptyState" class="empty-state">No games found.</div>
  </main>

  <div id="tipsModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tipsTitle">Tips</h2>
        <button class="close-btn" type="button" onclick="closeTipsModal()">✕</button>
      </div>
      <div id="tipsBody"></div>
    </div>
  </div>

  <div id="suggestionModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Suggest a Game</h2>
        <button class="close-btn" type="button" onclick="closeSuggestionModal()">✕</button>
      </div>
      <form class="suggestion-form" onsubmit="submitSuggestion(event)">
        <div class="form-group">
          <label for="suggestionName">Game Name</label>
          <input id="suggestionName" type="text" required placeholder="e.g. Neon Drift">
        </div>
        <div class="form-group">
          <label for="suggestionUrl">Game URL</label>
          <input id="suggestionUrl" type="url" required placeholder="https://example.com/game.html">
        </div>
        <div class="form-group">
          <label for="suggestionReason">Why it should be added</label>
          <textarea id="suggestionReason" rows="3" placeholder="Tell me why..."></textarea>
        </div>
        <button type="submit" style="width:100%; padding: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--button-text); border-radius: 10px; font-weight: 700; cursor: pointer;">Send Suggestion</button>
      </form>
    </div>
  </div>

  <div id="changelogModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Changelog</h2>
        <button class="close-btn" type="button" onclick="closeChangelog()">✕</button>
      </div>
      <div id="changelogBody"></div>
    </div>
  </div>

  <script>
    const ENCRYPTION_KEY = 'lockin_game_hub_v1';
    const GAMES_OWNER = 'lockin676767676767';
    const GAMES_REPO = 'games';
    const RAW_GAMES_BASE = `https://raw.githubusercontent.com/${GAMES_OWNER}/${GAMES_REPO}/main/`;
    const ADMIN_CODE = '67676767lockinWIDK';
    const RICKROLL_LINK = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';

    const CHANGELOG = [
      { date: '2026-10-01', entry: 'Added sidebar navigation with theme & genre filters' },
      { date: '2026-10-01', entry: 'Game of the Week now compact and less intrusive' },
      { date: '2026-10-01', entry: 'Added Changelog and Admin codes system' },
      { date: '2026-10-01', entry: 'Full offline support - works without internet after load' },
      { date: '2026-10-01', entry: 'Added 67 easter egg - Konami Code rickroll' },
      { date: '2026-10-01', entry: 'Improved UI with compact cards and better spacing' }
    ];

    const GENRES = ['All', 'Action', 'Arcade', 'Racing', 'Puzzle', 'Sports', 'Horror', 'Platformer', 'Adventure', 'Idle', 'Multiplayer', 'Strategy', 'Clicker', 'Shooter'];

    const GAME_IMAGE_MAP = {
      'run3': 'Images/Run3.jpg', 'backrooms': 'Images/Backrooms.jpg', 'driftboss': 'Images/DriftBoss.jpg',
      'ovo': 'Images/OvO.jpg', 'slope': 'Images/Slope.jpg', 'retrobowl': 'Images/RetroBowl.jpg', 'tinyfishing': 'Images/TinyFishing.jpg',
      '2048': 'Images/2048.jpg', 'flappybird': 'Images/FlappyBird.jpg', 'cookieclicker': 'Images/CookieClicker.jpg',
      'drivemad': 'Images/DriveMad.jpg', 'motox3m': 'Images/MotoX3M.jpg', 'basketballstars': 'Images/BasketballStars.jpg'
    };

    const TIP_LIBRARY = {
      'Run 3': ['Look ahead before jumping', 'Stay calm in tight sections', 'Practice early waves first'],
      'Backrooms': ['Keep moving forward', 'Explore alternate paths', 'Listen for audio cues'],
      'Drift Boss': ['Chain drifts together', 'Build speed before turns', 'Watch your car angle'],
      'OvO': ['Find landing spots first', 'Learn the rhythm', 'Take pauses between sections'],
      'Slope': ['Keep movements smooth', 'Use wall edges', 'Practice early waves'],
      'Retro Bowl': ['Manage play selection', 'Focus on field position', 'Build a balanced team'],
      'Tiny Fishing': ['Upgrade gear early', 'Be patient', 'Spend wisely']
    };

    const state = {
      games: JSON.parse(localStorage.getItem('games_cache') || '[]'),
      theme: localStorage.getItem('theme') || 'dark',
      activeGenre: 'All',
      searchQuery: '',
      adminMode: false,
      keySequence: ''
    };

    function makeFallbackImage(title = 'Game') {
      const label = encodeURIComponent(title.slice(0, 18));
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"><rect width="600" height="430" fill="#1a1a2e"/><rect x="30" y="30" width="540" height="370" rx="20" fill="rgba(124,156,255,0.2)"/><text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" fill="#a8c5ff" font-family="Arial, sans-serif" font-size="40" font-weight="700">${label}</text></svg>`)}`;
    }

    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      state.theme = theme;
      localStorage.setItem('theme', theme);
      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    function titleFromFileName(name) {
      const mapped = {
        'run3': 'Run 3', 'backrooms': 'Backrooms', 'driftboss': 'Drift Boss', 'ovo': 'OvO', 'slope': 'Slope',
        'retrobowl': 'Retro Bowl', 'tinyfishing': 'Tiny Fishing', '1.8': 'Minecraft', 'fnaf': 'FNAF',
        'motox3m': 'Moto X3M', 'basketballstars': 'Basketball Stars', '2048': '2048', 'flappybird': 'Flappy Bird',
        'cookieclicker': 'Cookie Clicker', 'drivemad': 'Drive Mad'
      };
      const key = name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      return mapped[key] || name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function inferGenre(fileName) {
      const combo = fileName.toLowerCase();
      if (combo.includes('race') || combo.includes('drift') || combo.includes('car') || combo.includes('motor')) return 'Racing';
      if (combo.includes('bowl') || combo.includes('basket') || combo.includes('ball') || combo.includes('sport')) return 'Sports';
      if (combo.includes('backrooms') || combo.includes('fnaf') || combo.includes('granny')) return 'Horror';
      if (combo.includes('run') || combo.includes('jump') || combo.includes('platform')) return 'Platformer';
      if (combo.includes('2048') || combo.includes('puzzle') || combo.includes('wordle')) return 'Puzzle';
      if (combo.includes('battle') || combo.includes('shoot') || combo.includes('fight')) return 'Action';
      if (combo.includes('clicker') || combo.includes('tap')) return 'Clicker';
      if (combo.includes('fishing') || combo.includes('farm') || combo.includes('idle')) return 'Idle';
      return 'Arcade';
    }

    function renderGenreFilters() {
      const container = document.getElementById('genreContainer');
      container.innerHTML = '';
      GENRES.forEach(genre => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sidebar-btn' + (genre === state.activeGenre ? ' active' : '');
        btn.textContent = genre;
        btn.addEventListener('click', () => {
          state.activeGenre = genre;
          renderGenreFilters();
          renderGames();
        });
        container.appendChild(btn);
      });
    }

    function renderGames() {
      const filtered = state.games.filter(g => {
        const matchQuery = !state.searchQuery || `${g.title} ${g.genre}`.toLowerCase().includes(state.searchQuery.toLowerCase());
        const matchGenre = state.activeGenre === 'All' || g.genre === state.activeGenre;
        return matchQuery && matchGenre;
      });

      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      filtered.forEach(game => {
        const card = document.createElement('article');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="thumb-wrap">
            <img class="thumb" src="${game.thumbnail}" alt="${game.title}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.src='${makeFallbackImage(game.title)}'" />
            <span class="thumb-badge">▶</span>
          </div>
          <div class="game-body">
            <span class="chip">${game.genre}</span>
            <h3 class="game-title">${game.title}</h3>
            <p class="game-description">${game.description || 'A fun game.'}</p>
            <div class="card-actions">
              <button type="button" class="play-btn" onclick="launchGame('${game.url}', '${game.title}')">Play</button>
              <button type="button" class="tips-btn" onclick="showTips('${game.title}')">Tips</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('emptyState').classList.toggle('visible', filtered.length === 0);
    }

    function showTips(title) {
      const tips = TIP_LIBRARY[title] || TIP_LIBRARY['Run 3'] || ['Take time to learn controls', 'Try again if you fail', 'Have fun!'];
      document.getElementById('tipsTitle').textContent = `${title} - Tips`;
      document.getElementById('tipsBody').innerHTML = `<ul class="tips-list">${tips.map((t, i) => `<li><strong>#${i + 1}:</strong> ${t}</li>`).join('')}</ul>`;
      document.getElementById('tipsModal').classList.add('open');
    }

    function closeTipsModal() {
      document.getElementById('tipsModal').classList.remove('open');
    }

    function openSuggestionModal() {
      document.getElementById('suggestionModal').classList.add('open');
    }

    function closeSuggestionModal() {
      document.getElementById('suggestionModal').classList.remove('open');
      document.getElementById('suggestionName').value = '';
      document.getElementById('suggestionUrl').value = '';
      document.getElementById('suggestionReason').value = '';
    }

    function submitSuggestion(e) {
      e.preventDefault();
      const title = document.getElementById('suggestionName').value;
      const url = document.getElementById('suggestionUrl').value;
      const reason = document.getElementById('suggestionReason').value;
      
      const issueTitle = encodeURIComponent(`Game suggestion: ${title}`);
      const issueBody = encodeURIComponent(`Game: ${title}\nURL: ${url}\n\nWhy: ${reason || 'N/A'}`);
      window.open(`https://github.com/${GAMES_OWNER}/hub/issues/new?title=${issueTitle}&body=${issueBody}`, '_blank');
      closeSuggestionModal();
    }

    function openChangelog() {
      const body = document.getElementById('changelogBody');
      body.innerHTML = CHANGELOG.map(c => `
        <div class="changelog-entry">
          <div class="changelog-date">${c.date}</div>
          <div class="changelog-text">✓ ${c.entry}</div>
        </div>
      `).join('');
      document.getElementById('changelogModal').classList.add('open');
    }

    function closeChangelog() {
      document.getElementById('changelogModal').classList.remove('open');
    }

    function openAdminPanel() {
      if (state.adminMode) {
        state.adminMode = false;
        document.getElementById('adminPanelContainer').innerHTML = '';
        document.getElementById('adminPanelContainer').style.display = 'none';
        return;
      }

      const code = prompt('Enter admin code:');
      if (code === ADMIN_CODE) {
        state.adminMode = true;
        document.getElementById('adminPanelContainer').innerHTML = `
          <div class="admin-panel">
            <h3>🔐 Admin Mode Active</h3>
            <p style="color:var(--muted); font-size:0.85rem; margin:0;">You have unlocked special features.</p>
            <button class="sidebar-btn" style="margin-top:10px;" onclick="clearCache()">Clear Local Cache</button>
            <button class="sidebar-btn" onclick="reloadGamesNow()">Force Reload Games</button>
            <button class="sidebar-btn" onclick="exportGamesJson()">Export Data</button>
          </div>
        `;
        document.getElementById('adminPanelContainer').style.display = 'block';
      }
    }

    function clearCache() {
      localStorage.removeItem('games_cache');
      state.games = [];
      alert('Cache cleared. Reload the page to fetch games.');
    }

    function reloadGamesNow() {
      loadGames();
      alert('Games reloaded!');
    }

    function exportGamesJson() {
      const data = JSON.stringify(state.games, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'games-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function playGameOfWeek() {
      if (state.games.length > 0) {
        const index = Math.floor(Date.now() / (7 * 24 * 60 * 60 * 1000)) % state.games.length;
        const game = state.games[index];
        launchGame(game.url, game.title);
      }
    }

    function updateGameOfWeek() {
      if (state.games.length === 0) return;
      const index = Math.floor(Date.now() / (7 * 24 * 60 * 60 * 1000)) % state.games.length;
      const game = state.games[index];
      document.getElementById('wotgImg').src = game.thumbnail;
      document.getElementById('wotgTitle').textContent = game.title;
      document.getElementById('wotgDesc').textContent = game.description || 'Click to play';
      document.getElementById('wotgCompact').style.display = 'flex';
    }

    function launchGame(url, title) {
      fetch(url)
        .then(r => r.text())
        .then(html => {
          const w = window.open('about:blank');
          if (!w) { alert('Popups blocked'); return; }
          w.document.write(html);
          w.document.close();
        })
        .catch(() => alert(`Failed to load ${title}`));
    }

    async function loadGames() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GAMES_OWNER}/${GAMES_REPO}/git/trees/main?recursive=1`);
        const data = await res.json();
        const tree = data.tree || [];

        const games = tree
          .filter(e => e.type === 'blob' && /\.html?$/i.test(e.path) && !e.path.includes('Images/'))
          .map(e => {
            const fileName = e.path.split('/').pop();
            const stem = fileName.replace(/\.[^.]+$/, '').toLowerCase();
            const title = titleFromFileName(fileName);
            const genre = inferGenre(fileName);
            const imagePath = GAME_IMAGE_MAP[stem] || `Images/${title}.jpg`;
            const thumbnail = new URL(imagePath, RAW_GAMES_BASE).toString();
            return { title, url: new URL(fileName, RAW_GAMES_BASE).toString(), genre, description: '', thumbnail };
          })
          .sort((a, b) => a.title.localeCompare(b.title));

        state.games = games;
        localStorage.setItem('games_cache', JSON.stringify(games));
        renderGenreFilters();
        renderGames();
        updateGameOfWeek();
      } catch (err) {
        console.log('Offline mode - using cached games');
        renderGenreFilters();
        renderGames();
        updateGameOfWeek();
      }
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      state.searchQuery = e.target.value;
      renderGames();
    });

    document.querySelectorAll('[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    setTheme(state.theme);

    // Konami Code: 67 (press 'C' key code)
    document.addEventListener('keydown', e => {
      state.keySequence += e.key.toLowerCase();
      if (state.keySequence.includes('67') || e.key === '6' || e.key === '7') {
        if (state.keySequence === '67' || state.keySequence.endsWith('67')) {
          window.open(RICKROLL_LINK, '_blank');
          state.keySequence = '';
        }
      }
      if (state.keySequence.length > 10) state.keySequence = state.keySequence.slice(-10);
    });

    loadGames();
  </script>
</body>
</html>
